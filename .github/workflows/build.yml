name: 📱 Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ── 1. سحب الكود ──────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. إعداد Node.js ──────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── 3. تثبيت الحزم ────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. نسخ ملفات الويب ────────────────────
      - name: Build web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp privacy-policy.html www/ 2>/dev/null || true
          cp delete-data.html    www/ 2>/dev/null || true
          echo "✅ Web assets ready"

      # ── 5. إضافة Android ──────────────────────
      - name: Add Capacitor Android
        run: npx cap add android

      # ── 6. مزامنة الأصول ─────────────────────
      - name: Sync Capacitor
        run: npx cap sync android --no-build

      # ── 7. نسخ أيقونات التطبيق ────────────────
      - name: Copy app icons
        run: |
          ICONS_SRC="android-icons"
          ICONS_DST="android/app/src/main/res"

          for DENSITY in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$ICONS_DST/$DENSITY"
            cp "$ICONS_SRC/$DENSITY/ic_launcher.png"            "$ICONS_DST/$DENSITY/"
            cp "$ICONS_SRC/$DENSITY/ic_launcher_round.png"      "$ICONS_DST/$DENSITY/"
            cp "$ICONS_SRC/$DENSITY/ic_launcher_foreground.png" "$ICONS_DST/$DENSITY/"
            echo "✅ Copied $DENSITY"
          done

          # Adaptive icon background (dark green)
          for DENSITY in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cat > "$ICONS_DST/$DENSITY/ic_launcher_background.xml" << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#0D1F0F"/>
          </shape>
          XML
          done
          echo "✅ Icons done"

      # ── 8. تحديث اسم التطبيق ─────────────────
      - name: Set app name in strings.xml
        run: |
          STRINGS="android/app/src/main/res/values/strings.xml"
          cat > "$STRINGS" << 'XML'
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">CodeNile</string>
              <string name="title_activity_main">CodeNile</string>
              <string name="package_name">com.codenile.app</string>
              <string name="custom_url_scheme">com.codenile.app</string>
          </resources>
          XML
          echo "✅ App name set"

      # ── 9. إعداد Java 17 ──────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      # ── 10. صلاحيات Gradle ───────────────────
      - name: Grant Gradle permissions
        run: chmod +x android/gradlew

      # ── 11. بناء الـAPK ───────────────────────
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2g"

      # ── 12. رفع الـAPK ────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeNile-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 13. معلومات البناء ────────────────────
      - name: Build summary
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "✅ APK: $SIZE | Build #${{ github.run_number }}"
          echo "📥 Download from: Actions → CodeNile-v${{ github.run_number }}"
