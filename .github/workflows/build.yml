name: 📱 Build Signed AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release AAB (Signed)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor-community/admob@8.0.0

      - name: Build web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp privacy-policy.html www/ 2>/dev/null || true
          cp delete-data.html    www/ 2>/dev/null || true

      - name: Add Capacitor Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix variables.gradle
        run: |
          VARS="android/variables.gradle"
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/g' "$VARS"
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' "$VARS"
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 23/g' "$VARS"
          grep -i "SdkVersion\|minSdk" "$VARS"

      - name: Fix app/build.gradle versionCode
        run: |
          GRADLE="android/app/build.gradle"
          sed -i 's/versionCode [0-9]*/versionCode 4/g' "$GRADLE"
          sed -i 's/versionCode = [0-9]*/versionCode = 4/g' "$GRADLE"
          grep -i "versionCode" "$GRADLE"

      - name: Upgrade AGP to 8.5.0
        run: |
          sed -i 's/com\.android\.tools\.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.5.0/g' android/build.gradle
          grep "tools.build:gradle" android/build.gradle

      - name: Upgrade Gradle to 8.7
        run: |
          sed -i 's|gradle-[0-9.]*-all.zip|gradle-8.7-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          grep "distributionUrl" android/gradle/wrapper/gradle-wrapper.properties

      - name: Add AdMob to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7608701150166997~8374315008"/>\n        <meta-data android:name="com.google.android.gms.ads.DELAY_APP_MEASUREMENT_INIT" android:value="true"/>\n    </application>|' "$MANIFEST"
          sed -i 's|</manifest>|    <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>\n</manifest>|' "$MANIFEST"
          grep -i "gms.ads\|AD_ID" "$MANIFEST"

      - name: Copy app icons
        run: |
          ICONS_SRC="android-icons"
          ICONS_DST="android/app/src/main/res"
          for DENSITY in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$ICONS_DST/$DENSITY"
            cp "$ICONS_SRC/$DENSITY/ic_launcher.png"            "$ICONS_DST/$DENSITY/"
            cp "$ICONS_SRC/$DENSITY/ic_launcher_round.png"      "$ICONS_DST/$DENSITY/"
            cp "$ICONS_SRC/$DENSITY/ic_launcher_foreground.png" "$ICONS_DST/$DENSITY/"
          done
          for DENSITY in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cat > "$ICONS_DST/$DENSITY/ic_launcher_background.xml" << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#0D1F0F"/>
          </shape>
          XML
          done

      - name: Set app name
        run: |
          cat > "android/app/src/main/res/values/strings.xml" << 'XML'
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">CodeNile</string>
              <string name="title_activity_main">CodeNile</string>
              <string name="package_name">com.codenile.app</string>
              <string name="custom_url_scheme">com.codenile.app</string>
          </resources>
          XML

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/android/app/codenile.jks

      - name: Grant Gradle permissions
        run: chmod +x android/gradlew

      - name: Build Signed Release AAB
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/codenile.jks \
            -Pandroid.injected.signing.store.password="${KEY_STORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}" \
            --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Build Signed Release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/codenile.jks \
            -Pandroid.injected.signing.store.password="${KEY_STORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}" \
            --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: CodeNile-AAB-v${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeNile-APK-v${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
